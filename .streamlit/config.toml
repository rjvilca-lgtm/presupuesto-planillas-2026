[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FBFBFD"
secondaryBackgroundColor = "#EEF1F6"
textColor = "#1A1F2B"
font = "sans serif"

[server]
maxUploadSize = 5
# Sin vigilar archivos: en Streamlit Cloud llenaba los logs con
# "inotify instance limit reached" (el código cambia solo al hacer push)
fileWatcherType = "none"
# Comprime lo que el servidor envía al navegador (tablas, pantallas): ayuda
# mucho con internet lento, a cambio de un poco de trabajo del servidor
enableWebsocketCompression = true
